name: validate

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Swift build
        run: swift build -c debug
      - name: Repository validation
        run: python3 Tests/validate_repo.py

